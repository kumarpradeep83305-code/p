name: Build Screener Android APK

on:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp siteman.html www/siteman.html
          cp app_icon.png assets/icon.png

      - name: Create Android project
        run: npx cap add android

      - name: Generate Android icon and splash assets
        run: npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor "#07080c" --iconBackgroundColorDark "#07080c" --splashBackgroundColor "#07080c" --splashBackgroundColorDark "#07080c"

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: screener-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

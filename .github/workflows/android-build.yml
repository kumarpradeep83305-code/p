name: Build and Release Screener APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Prepare web app
        run: |
          mkdir -p www assets
          cp index.html www/index.html
          cp siteman.html www/siteman.html
          cp app_icon.png assets/icon.png

      - name: Add Android platform
        run: npx cap add android

      - name: Generate Android app icon
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/screener-release.keystore

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PRADEEP }}
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text()

          if "signingConfigs {" not in text:
              marker = "    buildTypes {"
              signing = """    signingConfigs {
                  release {
                      storeFile file("../screener-release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias "screener"
                      keyPassword System.getenv("KEYSTORE_PASSWORD")
                  }
              }

          """
              if marker not in text:
                  raise SystemExit("Could not find buildTypes block")
              text = text.replace(marker, signing + marker, 1)

          start = text.find("    buildTypes {")
          release_pos = text.find("        release {", start)

          if release_pos == -1:
              raise SystemExit("Could not find release build type")

          section = text[release_pos:release_pos + 700]

          if "signingConfig signingConfigs.release" not in section:
              insert_at = release_pos + len("        release {\n")
              text = (
                  text[:insert_at]
                  + "            signingConfig signingConfigs.release\n"
                  + text[insert_at:]
              )

          path.write_text(text)
          PY

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PRADEEP }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Verify APK
        run: |
          ls -lh android/app/build/outputs/apk/release/
          test -f android/app/build/outputs/apk/release/app-release.apk

      - name: Remove keystore
        run: |
          rm -f android/screener-release.keystore

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Screener Android v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk

name: Generate Screener Signing Key

on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate release keystore
        env:
          STORE_PASSWORD: ${{ secrets.PRADEEP }}
        run: |
          keytool -genkeypair \
            -v \
            -keystore screener-release.keystore \
            -alias screener \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$STORE_PASSWORD" \
            -keypass "$STORE_PASSWORD" \
            -dname "CN=Screener, OU=App, O=Pradeep, L=India, ST=India, C=IN"

      - name: Upload signing keystore
        uses: actions/upload-artifact@v4
        with:
          name: screener-signing-keystore
          path: screener-release.keystore
